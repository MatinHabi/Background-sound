<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Slow Rain & Fire</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">

<style>
  /* Layout: one narrow column. Play button on top, a panel per sound, then the master controls. */
  :root {
    color-scheme: dark;
    --night: #10141b;      /* page background */
    --panel: #19202b;      /* sound panels */
    --line: #2a3443;       /* borders */
    --text: #e6e9ee;
    --dim: #93a0b3;        /* labels and readouts */
    --rain: #7fb4e6;       /* rain sliders */
    --fire: #f0a04b;       /* fire sliders */
    --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --body: "Atkinson Hyperlegible", system-ui, sans-serif;
  }

  body {
    background: var(--night);
    color: var(--text);
    font: 16px/1.5 var(--body);
    padding-inline: 16px;
    padding-block: 28px 48px;
  }
  

  main { max-width: 480px; margin-inline: auto; display: grid; gap: 16px; }

  header { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  h1 { font: 600 1.7rem/1.1 var(--display); margin: 0; text-wrap: balance; }
  h2 { font: 600 1.15rem/1.2 var(--display); margin: 0; }

  #play {
    font: 700 1rem var(--body);
    color: var(--night);
    background: var(--text);
    border: 0;
    border-radius: 999px;
    padding: 12px 26px;
    cursor: pointer;
  }
  #play:focus-visible, input:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
    display: grid;
    gap: 14px;
  }
  .rain { accent-color: var(--rain); }
  .fire { accent-color: var(--fire); }
  .master { accent-color: var(--text); background: none; }

  .heading { display: flex; align-items: center; justify-content: space-between; }
  .heading label { display: flex; align-items: center; gap: 8px; color: var(--dim); font-size: 0.9rem; }
  .heading input { width: 20px; height: 20px; }

  /* One slider row: name on the left, current value on the right, slider underneath. */
  .row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
  .row label { font-size: 0.95rem; }
  .row output { color: var(--dim); font-size: 0.9rem; font-variant-numeric: tabular-nums; }
  .row input { grid-column: 1 / -1; width: 100%; height: 28px; margin: 0; }

  p.note { color: var(--dim); font-size: 0.85rem; margin: 0; }
</style>

<main>
  <header>
    <h1>Slow Rain &amp; Fire</h1>
    <button id="play">Play</button>
  </header>

  <section class="rain">
    <div class="heading">
      <h2>Rain</h2>
      <label><input type="checkbox" id="rainOn" checked> On</label>
    </div>
    <div class="row">
      <label for="rainRate">Speed</label><output id="rainRateOut"></output>
      <input type="range" id="rainRate" min="1" max="60" step="1" value="10">
    </div>
    <div class="row">
      <label for="rainLevel">Level</label><output id="rainLevelOut"></output>
      <input type="range" id="rainLevel" min="0" max="1" step="0.01" value="0.7">
    </div>
  </section>

  <section class="fire">
    <div class="heading">
      <h2>Fire</h2>
      <label><input type="checkbox" id="fireOn" checked> On</label>
    </div>
    <div class="row">
      <label for="fireRate">Speed</label><output id="fireRateOut"></output>
      <input type="range" id="fireRate" min="0.5" max="20" step="0.5" value="3">
    </div>
    <div class="row">
      <label for="fireLevel">Level</label><output id="fireLevelOut"></output>
      <input type="range" id="fireLevel" min="0" max="1" step="0.01" value="0.7">
    </div>
  </section>

  <section class="master">
    <h2>Volume and EQ</h2>
    <div class="row">
      <label for="volume">Volume</label><output id="volumeOut"></output>
      <input type="range" id="volume" min="0" max="1" step="0.01" value="0.6">
    </div>
    <div class="row">
      <label for="bass">Bass</label><output id="bassOut"></output>
      <input type="range" id="bass" min="-12" max="12" step="1" value="0">
    </div>
    <div class="row">
      <label for="mid">Mid</label><output id="midOut"></output>
      <input type="range" id="mid" min="-12" max="12" step="1" value="0">
    </div>
    <div class="row">
      <label for="treble">Treble</label><output id="trebleOut"></output>
      <input type="range" id="treble" min="-12" max="12" step="1" value="0">
    </div>
  </section>

  <p class="note">No sound on iPhone? Flip the silent switch off. Sound may stop when the screen locks.</p>
</main>

<script>
// ---------------------------------------------------------------
// HOW IT WORKS
// Nothing here is a recording. Every sound is made from white noise:
//   rain = a soft hiss + lots of tiny noise "pops" (the drops)
//   fire = a low rumble + sharper noise "pops" (the crackles)
// "Speed" is just how many pops happen per second, so slowing it
// down never changes the pitch and never sounds robotic.
//
// Signal path:  rain ─┐
//                     ├─> bass -> mid -> treble -> volume -> speakers
//               fire ─┘
// ---------------------------------------------------------------

const ctx = new AudioContext();   // starts paused until Play is pressed
const $ = (id) => document.getElementById(id);


// ---- 1. Master chain: 3-band EQ, then volume --------------------

function makeEqBand(type, frequency) {
  const band = ctx.createBiquadFilter();
  band.type = type;
  band.frequency.value = frequency;
  return band;
}
const bass   = makeEqBand("lowshelf", 200);
const mid    = makeEqBand("peaking", 1000);
const treble = makeEqBand("highshelf", 4000);
const volume = ctx.createGain();

bass.connect(mid).connect(treble).connect(volume).connect(ctx.destination);


// ---- 2. White noise: 2 seconds of random numbers ----------------

const noise = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
const samples = noise.getChannelData(0);
console.log(samples)
for (let i = 0; i < samples.length; i++) samples[i] = Math.random() * 2 - 1;

console.log(samples)
// A constant background layer: looped noise through one filter.
// Returns its gain node so we can set how loud it is.
function makeBed(filterType, frequency, output) {
  const source = ctx.createBufferSource();
  source.buffer = noise;
  source.loop = true;

  const filter = ctx.createBiquadFilter();
  filter.type = filterType;
  filter.frequency.value = frequency;

  const gain = ctx.createGain();
  source.connect(filter).connect(gain).connect(output);
  source.start();
  return gain;
}

// One pop: a very short burst of noise that fades out fast.
//   pitch    = how bright it sounds (Hz)
//   length   = how long it lasts (seconds)
//   loudness = 0 to 1
function pop(time, pitch, length, loudness, output) {
  const source = ctx.createBufferSource();
  source.buffer = noise;

  const filter = ctx.createBiquadFilter();
  filter.type = "bandpass";
  filter.frequency.value = pitch;

  const gain = ctx.createGain();
  gain.gain.setValueAtTime(loudness, time);
  gain.gain.exponentialRampToValueAtTime(0.001, time + length);

  source.connect(filter).connect(gain).connect(output);
  source.start(time, Math.random());   // start at a random spot in the noise
  source.stop(time + length);
}

const random = (min, max) => min + Math.random() * (max - min);


// ---- 3. The two sounds ------------------------------------------

const rain = { on: true, rate: 10, level: 0.7, nextPop: 0, out: ctx.createGain() };
const fire = { on: true, rate: 3,  level: 0.7, nextPop: 0, out: ctx.createGain() };
rain.out.connect(bass);
fire.out.connect(bass);

rain.hiss   = makeBed("highpass", 1500, rain.out);  // gets louder as rain gets faster
fire.rumble = makeBed("lowpass", 180, fire.out);
fire.rumble.gain.value = 0.5;

rain.makePop = (time) => pop(time, random(2000, 7000), random(0.03, 0.08), random(0.1, 0.5), rain.out);

// Cubing the random number makes most crackles quiet and a few loud.
fire.makePop = (time) => pop(time, random(1000, 5000), random(0.004, 0.03), 0.05 + Math.random() ** 3 * 1.5, fire.out);


// ---- 4. Scheduler: decide when the pops happen ------------------
// Ten times a second, queue up every pop due in the next 0.2 seconds.
// The gap between pops is random, averaging 1 / rate seconds.

function schedule(sound) {
  if (!sound.on) return;
  const now = ctx.currentTime;
  if (sound.nextPop < now) sound.nextPop = now;

  while (sound.nextPop < now + 0.2) {
    sound.makePop(sound.nextPop);
    sound.nextPop += -Math.log(1 - Math.random()) / sound.rate;
  }
}

setInterval(() => {
  if (ctx.state !== "running") return;
  schedule(rain);
  schedule(fire);
}, 100);


// ---- 5. Hook up the controls ------------------------------------

// Runs `apply` now and every time the slider moves, and updates its readout.
function bind(id, apply, format) {
  const slider = $(id);
  const update = () => {
    const value = Number(slider.value);
    apply(value);
    $(id + "Out").textContent = format(value);
  };
  slider.addEventListener("input", update);
  update();
}

const percent = (v) => Math.round(v * 100) + "%";
const decibels = (v) => (v > 0 ? "+" : "") + v + " dB";

// A sound's output is its level when on, silent when off.
const setLevel = (sound) => { sound.out.gain.value = sound.on ? sound.level : 0; };

bind("rainRate",  (v) => { rain.rate = v; rain.hiss.gain.value = v / 60 * 0.15; }, (v) => v + " drops/sec");
bind("rainLevel", (v) => { rain.level = v; setLevel(rain); }, percent);
bind("fireRate",  (v) => { fire.rate = v; }, (v) => v + " crackles/sec");
bind("fireLevel", (v) => { fire.level = v; setLevel(fire); }, percent);

bind("volume", (v) => { volume.gain.value = v; }, percent);
bind("bass",   (v) => { bass.gain.value = v; },   decibels);
bind("mid",    (v) => { mid.gain.value = v; },    decibels);
bind("treble", (v) => { treble.gain.value = v; }, decibels);

$("rainOn").addEventListener("change", (e) => { rain.on = e.target.checked; setLevel(rain); });
$("fireOn").addEventListener("change", (e) => { fire.on = e.target.checked; setLevel(fire); });

// Browsers only allow sound after a tap, so Play is what starts the audio.
$("play").addEventListener("click", async () => {
  if (ctx.state === "running") await ctx.suspend();
  else await ctx.resume();
  $("play").textContent = ctx.state === "running" ? "Pause" : "Play";
});
</script>

</body></html>
